<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chewie Says</title>
<style>
  :root { --bg1:#fff8ea; --bg2:#eac38a; --ink:#2a1d15; --card:#ffffffee; --accent:#8b4f24; --accent2:#516036; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink); background:radial-gradient(circle at top,var(--bg1),var(--bg2));
    display:flex; justify-content:center; align-items:center; padding:18px;
  }
  .app { width:min(520px,100%); text-align:center; background:var(--card); border-radius:32px; padding:22px; box-shadow:0 22px 70px #56301355; }
  h1 { margin:6px 0 2px; font-size:36px; letter-spacing:-.6px; }
  .sub { margin:0 0 16px; opacity:.72; font-size:16px; }
  img { width:232px; height:232px; object-fit:cover; border-radius:50%; border:8px solid white; box-shadow:0 12px 34px #5a351955; margin:8px auto 18px; display:block; }
  .bubble { min-height:86px; background:#fff; border-radius:23px; padding:17px; display:flex; align-items:center; justify-content:center; font-size:24px; line-height:1.22; font-weight:800; box-shadow:inset 0 0 0 1px #00000012; margin-bottom:15px; }
  button { border:0; border-radius:18px; padding:16px 14px; font-size:18px; font-weight:850; color:white; background:var(--accent); box-shadow:0 8px 0 #5c3318; width:100%; touch-action:manipulation; cursor:pointer; }
  button:active { transform:translateY(5px); box-shadow:0 3px 0 #5c3318; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .small { background:var(--accent2); box-shadow:0 6px 0 #323c20; font-size:15px; padding:13px 10px; }
  .small:active { box-shadow:0 2px 0 #323c20; }
  .hint { margin:14px 0 2px; font-size:12px; opacity:.58; }
</style>
</head>
<body>
<main class="app">
  <h1>Chewie Says</h1>
  <p class="sub">Executive doggie commentary.</p>
  <img id="photo" src="chewie_selfie.jpeg" alt="Chewie">
  <div id="phrase" class="bubble">“Tap Ask Chewie.”</div>
  <button id="ask">🐾 Ask Chewie</button>
  <div class="grid" id="buttons"></div>
  <p class="hint">Volume on. Tap a button to hear Chewie.</p>
</main>

<script>
const photos = ["chewie_selfie.jpeg", "chewie_christmas.jpeg", "chewie_grass.jpeg"];

const clips = [
  { label: "Right, Dad", text: "You're right, Dad.", file: "youre_right_dad.mp3" },
  { label: "Boss", text: "Whatever you say, Boss.", file: "whatever_you_say_boss.mp3" },
  { label: "Bite?", text: "Can I have a bite?", file: "can_i_have_a_bite.mp3" },
  { label: "Chicken", text: "I've reviewed the evidence.", file: "chicken_is_appropriate.mp3" }
];

let lastIndex = -1;
let currentAudio = null;

function pickIndex() {
  if (clips.length === 1) return 0;
  let i;
  do { i = Math.floor(Math.random() * clips.length); } while (i === lastIndex);
  lastIndex = i;
  return i;
}

function setRandomPhoto() {
  document.getElementById("photo").src = photos[Math.floor(Math.random() * photos.length)];
}

function playClip(clip) {
  document.getElementById("phrase").textContent = "“" + clip.text + "”";
  setRandomPhoto();
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  currentAudio = new Audio(clip.file);
  currentAudio.play().catch(() => {
    document.getElementById("phrase").textContent = "Tap again to let Chewie speak.";
  });
}

function askChewie() { playClip(clips[pickIndex()]); }

document.getElementById("ask").addEventListener("click", askChewie);

const buttons = document.getElementById("buttons");
clips.forEach((clip) => {
  const b = document.createElement("button");
  b.className = "small";
  b.textContent = clip.label;
  b.addEventListener("click", () => playClip(clip));
  buttons.appendChild(b);
});
</script>
</body>
</html>
